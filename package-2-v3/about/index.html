  <script id="preview-native-links">
(() => {
  const base = "/dingbox-previews/package-2-v3";
  const routes = new Set(["/","/portfolio","/about","/testimonials","/games/crowd-chant","/portfolio/galactic-realms","/portfolio/crosslocked","/portfolio/breath-of-the-baby","/portfolio/puzzle-of-time","/portfolio/uniquechess","/portfolio/alphapuzz","/portfolio/dostadning","/portfolio/prophecy-of-fire"]);
  function scopeLink(link) {
    const href = link.getAttribute('href');
    if (!href || !href.startsWith('/') || href.startsWith('//')) return;
    if (routes.has(new URL(href, location.origin).pathname)) link.setAttribute('href', base + href);
  }
  new MutationObserver(records => {
    for (const record of records) {
      if (record.type === 'attributes' && record.target.matches('a[href]')) scopeLink(record.target);
      for (const node of record.addedNodes) {
        if (node.nodeType !== 1) continue;
        if (node.matches('a[href]')) scopeLink(node);
        node.querySelectorAll('a[href]').forEach(scopeLink);
      }
    }
  }).observe(document.documentElement, {childList: true, attributes: true, attributeFilter: ['href'], subtree: true});
})();
</script>
